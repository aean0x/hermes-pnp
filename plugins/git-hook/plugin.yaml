name: git-hook
version: 0.3.1
description: >-
  Auto fetch/pull before reads, and commit+push only the files this turn
  changed, for any git worktree Hermes touches. Failures surface in-session
  (not log-only); busy/push-fail retries. No tools, no scripts.
  Disable with GIT_HOOK_COMMIT=0.
author: aean0x
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
