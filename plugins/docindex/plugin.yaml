name: docindex
version: 0.1.0
description: >-
  Hybrid keyword + semantic search over the local document index (FTS5 +
  sqlite-vec): search, stats, show, index and verify. The engine ships in
  bin/ and runs under configured interpreters, because sqlite-vec and the
  OCR toolchain live outside the agent runtime.
author: aean0x
kind: standalone
provides_tools:
  - docindex_search
  - docindex_stats
  - docindex_show
  - docindex_index
  - docindex_verify
requires_env:
  - DOCINDEX_DB
  - DOCINDEX_PYTHON
  - DOCVEC_PYTHON
