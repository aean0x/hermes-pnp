name: browser-lease
version: 0.1.0
description: >-
  Serialise browser access across Hermes sessions: one session checks the shared
  CDP browser out for its turn. An advisory flock in the Hermes home (taken on
  the first browser_* call, renewed per call, released at turn end or after
  browser.lease.sticky_s idle) makes concurrent sessions wait
  browser.lease.wait_s and then fail fast with a retryable blocked tool result
  naming the holder, instead of stacking a second tab set on the same engine.
author: aean0x
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_llm_call
